<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Sehzade Loading Entrance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--ink:#0b0b0b;--red:#ff2d20;--paper:#f2f2f2}
@font-face{font-family:"Anton";font-style:normal;font-weight:400;font-display:swap;src:url(../fuc/assets/anton-latin.woff2) format("woff2")}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
#stage{position:fixed;inset:0}


#intro{position:fixed;inset:0;z-index:1;pointer-events:none;display:block;color:#0b0b0b}
#intro{display:block}
#intro canvas.in-bg{position:absolute;inset:0;width:100%;height:100%;display:block;background:#ff2d20}
#intro .in-ui{position:absolute;inset:0}
#intro .in-pct,#intro .in-welcome,#intro .in-line{transition:opacity .7s ease}
#intro.out .in-pct,#intro.out .in-welcome,#intro.out .in-line{opacity:0}
#intro .in-line{position:absolute;left:0;right:0;top:50%;height:2px}
#intro .in-line i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#0b0b0b;transform-origin:0 50%;transform:scaleX(0)}
#intro .in-pct,#intro .in-welcome{position:absolute;top:50%;margin-top:-34px;font:400 16px/1 "Anton",Impact,sans-serif;text-transform:uppercase;letter-spacing:0;white-space:nowrap;font-variant-numeric:tabular-nums}
#intro .in-pct{left:32px}
#intro .in-welcome{right:32px}
#intro .in-big{padding-bottom:.07em;position:absolute;left:24px;bottom:3vw;font:400 20vw/.82 "Anton",Impact,sans-serif;text-transform:uppercase;letter-spacing:0;white-space:nowrap;filter:url(#in-liquid);will-change:filter}
#intro .in-big span{display:inline-block;transform:translateY(105%);opacity:0}
@media (max-width:809.98px){#intro .in-pct{left:16px}#intro .in-welcome{right:16px}#intro .in-big{left:12px;font-size:23vw;bottom:5vw}}

#replay{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:5;padding:9px 16px;border:1px solid rgba(242,242,242,.35);border-radius:999px;background:rgba(11,11,11,.6);color:var(--paper);font:400 12px/1 "Anton",Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s ease,border-color .4s}
#replay.on{opacity:1;pointer-events:auto}
#replay:hover{border-color:var(--paper)}
#replay:focus-visible{outline:2px solid var(--paper);outline-offset:3px}

#panel{position:fixed;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:6;width:min(340px,calc(100vw - 32px));max-height:calc(100% - 32px);display:flex;flex-direction:column;border:1px solid rgba(242,242,242,.16);border-radius:16px;background:rgba(14,14,14,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--paper);box-shadow:0 18px 50px rgba(0,0,0,.45);font-family:"Anton",Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;transition:opacity .5s ease,transform .6s cubic-bezier(.22,1,.36,1)}
#panel.shut{opacity:0;transform:translateY(-8px);pointer-events:none}
#panel .pn-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;font-size:13px}
#panel #panel-list{overflow:auto;padding:0 16px 4px;min-height:0}
#panel .pn-sec{margin:14px 0 10px;padding-top:12px;border-top:1px solid rgba(242,242,242,.12);font-size:11px;color:rgba(242,242,242,.5)}
#panel .pn-sec:first-child{margin-top:4px;border-top:0;padding-top:0}
#panel .pn-row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:12px;font-size:11px;color:rgba(242,242,242,.75)}
#panel .pn-row b{font-weight:400;color:var(--paper);font-variant-numeric:tabular-nums}
#panel .pn-row small{grid-column:1/-1;font:400 10px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em;text-transform:none;color:rgba(242,242,242,.5)}
#panel input[type=range]{grid-column:1/-1;width:100%;height:16px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer}
#panel input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:rgba(242,242,242,.25)}
#panel input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:rgba(242,242,242,.25)}
#panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;border-radius:50%;border:0;background:var(--paper)}
#panel input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;border:0;background:var(--paper)}
#panel .pn-act{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 16px 14px;border-top:1px solid rgba(242,242,242,.12)}
#panel button,#pn-toggle{font:inherit;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--paper);background:transparent;border:1px solid rgba(242,242,242,.22);border-radius:999px;padding:8px 6px;cursor:pointer;transition:border-color .4s,background .4s}
#panel button:hover,#pn-toggle:hover{border-color:rgba(242,242,242,.6);background:rgba(242,242,242,.08)}
#panel :focus-visible,#pn-toggle:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
#pn-toggle{font-family:"Anton",Impact,sans-serif;position:fixed;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;padding:8px 14px;background:rgba(14,14,14,.7)}
#panel:not(.shut)~#pn-toggle{opacity:0;pointer-events:none}
@media (max-width:600px){#panel{top:auto;bottom:max(16px,env(safe-area-inset-bottom,0px));max-height:55%}#pn-toggle{top:auto;bottom:max(16px,env(safe-area-inset-bottom,0px))}#replay{display:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="panel" role="group" aria-label="Loading controls"><div class="pn-head"><span>Loading controls</span></div><div id="panel-list"></div><div class="pn-act"><button type="button" id="pn-replay">Replay</button><button type="button" id="pn-copy">Copy values</button><button type="button" id="pn-reset">Reset</button></div></div>
<button id="pn-toggle" type="button" aria-expanded="true">Hide controls</button>
<button id="replay" type="button" aria-label="Replay the loading entrance">Replay (R)</button>
<script>
(function () {
  var TEMPLATE = '<div id="intro" aria-hidden="true">\n<canvas class="in-bg" id="seep"></canvas><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>\n<filter id="in-liquid" x="-25%" y="-60%" width="150%" height="240%" color-interpolation-filters="sRGB"><feTurbulence id="in-liq-t" type="fractalNoise" baseFrequency="0.011 0.018" numOctaves="2" seed="3" result="n"/><feOffset id="in-liq-o" in="n" dx="0" dy="0" result="o"/><feDisplacementMap id="in-liq-d" in="SourceGraphic" in2="o" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>\n</defs></svg>\n<div class="in-ui"><span class="in-pct">0%</span><span class="in-welcome">Designer</span><div class="in-line"><i></i></div><div class="in-big" aria-hidden="true"></div></div>\n</div>\n';
  var CFG = {
    min: 2400,          /* shortest time the loading screen stays (ms) */
    line: 2,            /* loading line thickness (px) */
    letterDelay: 600, letterTime: 1100, letterStagger: 50,           /* SEHZADE letters rising (ms) */
    liquid: 10, liquidBurst: 10, liquidBurstTime: 3100,               /* ripple on the letters: steady, opening burst (px), how long the burst takes */
    exitTime: 1000, exitMelt: 80, exitStagger: 50,                   /* text leaving: time (ms), liquid melt (px), letter stagger (ms) */
    seepTime: 4200, seepSoft: 22, seepLag: 18, seepScale: 22, seepFlow: 100, seepBias: 35, seepRim: 40, seepGrain: 3  /* red seeps into black: time (ms), edge softness (%), depth layer spread (%), pattern detail, flow (%), from-bottom bias (%), hot edge glow (%), grain (%) */
  };
  window.__run = 0;
  function play() {
    document.getElementById("replay").classList.remove("on");
  var stage = document.getElementById("stage"); stage.innerHTML = TEMPLATE; var RUN = ++window.__run;
  var intro = document.getElementById("intro"), big = intro.querySelector(".in-big"), pct = intro.querySelector(".in-pct"),
      bar = intro.querySelector(".in-line i"), line = intro.querySelector(".in-line"), liqO = document.getElementById("in-liq-o"),
      liqD = document.getElementById("in-liq-d"), cv = document.getElementById("seep");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, T0 = performance.now(), W = innerWidth, H = innerHeight;
  function setA(el, k, v) { if (el) el.setAttribute(k, v); }

  /* the word always spans the full screen width */
  function fit() {
    var m = parseFloat(getComputedStyle(big).left) || 24;
    big.style.fontSize = "100px";
    var w = big.getBoundingClientRect().width;
    if (w > 0) big.style.fontSize = (100 * (innerWidth - 2 * m) / w).toFixed(2) + "px";
  }
  line.style.height = CFG.line + "px";
  "SEHZADE".split("").forEach(function (c, i) {
    var sp = document.createElement("span"); sp.textContent = c; big.appendChild(sp);
    sp.animate([{ transform: "translateY(105%)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }],
      { duration: reduce ? 1 : CFG.letterTime, delay: (reduce ? 0 : CFG.letterDelay) + i * CFG.letterStagger, easing: "cubic-bezier(.22,1,.36,1)", fill: "forwards" });
  });
  fit(); window.__fit = fit;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  /* progress: real signals (fonts, page load), never faster than the minimum show time */
  var target = 8, p = 0, last = T0, finished = false, MIN = reduce ? 600 : CFG.min;
  function stg(v) { if (v > target) target = v; }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { stg(45); });
  setTimeout(function () { stg(75); }, 500); setTimeout(function () { stg(100); }, 1400);

  var exitT0 = 0, wiping = false, wipeActive = false;
  function liquid(now) {
    var t = now - T0, pulse = reduce ? 0 : Math.max(0, 1 - t / CFG.liquidBurstTime), ek = 0;
    if (exitT0) { ek = Math.max(0, Math.min(1, (now - exitT0) / CFG.exitTime)); ek *= ek; }
    setA(liqD, "scale", (reduce ? 0 : CFG.liquid + CFG.liquidBurst * pulse + 4 * Math.sin(t / 700) + CFG.exitMelt * ek).toFixed(1));
    setA(liqO, "dx", (Math.sin(t / 900) * 90).toFixed(1)); setA(liqO, "dy", (t / 18 % 400).toFixed(1));
  }
  function frame(now) {
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    liquid(now);
    if (!finished) {
      var cap = Math.min(100, (now - T0) / MIN * 100);
      p = Math.min(target, cap, p + Math.max((target - p) * 2.4, 12) * dt);
      pct.textContent = Math.floor(p) + "%"; bar.style.transform = "scaleX(" + (p / 100).toFixed(4) + ")";
      if (p >= 99.9 && target >= 100) { finished = true; pct.textContent = "100%"; bar.style.transform = "scaleX(1)"; setTimeout(function () { if (RUN === window.__run) wipe(); }, 250); }
    }
    if (RUN === window.__run && (!wiping || wipeActive)) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* red -> black: the red is soaked up by the black underneath, like ink sinking into paper. Three layers of red (bright surface, deep
     red, smoky ember) sit at different depths; each is eaten by its own slowly drifting noise field, so patches go at different times
     and the deeper layers linger below the surface. Drawn with a small WebGL shader. */
  var VS = "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
  var FS = "precision highp float;uniform vec2 res;uniform float time,front,soft,lag,scale,flow,bias,rim,grain;" +
    "float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}" +
    "float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*f*(f*(f*6.-15.)+10.);float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}" +
    "float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.8,-.6,.6,.8);for(int i=0;i<4;i++){v+=a*noise(p);p=r*p*2.03+11.7;a*=.48;}return v;}" +
    "void main(){vec2 uv=gl_FragCoord.xy/res;vec2 p=vec2(uv.x*res.x/res.y,uv.y)*scale;float tm=time*flow*.05;" +
    "vec2 q=vec2(fbm(p+vec2(0.,tm)),fbm(p+vec2(5.2,1.3)-vec2(tm,0.)));float n1=fbm(p+1.8*q);" +
    "vec2 q2=vec2(fbm(p*.7+vec2(8.3,2.8)+tm*.6),fbm(p*.7+vec2(1.7,9.2)-tm*.5));float n2=fbm(p*.7+2.2*q2+3.1);" +
    "n1=smoothstep(.0,1.,clamp((n1-.3)/.4,0.,1.));n2=smoothstep(.0,1.,clamp((n2-.3)/.4,0.,1.));" +
    "float fA=mix(n1,uv.y,bias),fB=mix(mix(n1,n2,.6),uv.y,bias),fC=mix(n2,uv.y,bias*.8);" +
    "float sA=soft,sB=soft*1.6,sC=soft*2.4,lB=lag,lC=lag*2.;" +
    "float aA=smoothstep(front-sA,front+sA,fA),aB=smoothstep(front-lB-sB,front-lB+sB,fB),aC=smoothstep(front-lC-sC,front-lC+sC,fC);" +
    "vec3 col=vec3(.043);col=mix(col,vec3(.2,.035,.03),aC);col=mix(col,vec3(.55,.09,.06),aB);col=mix(col,vec3(1.,.176,.125),aA);" +
    "float edge=aA*(1.-aA)*4.;col=mix(col,vec3(1.,.42,.22),edge*rim);" +
    "col+=(hash(gl_FragCoord.xy+fract(time)*97.)-.5)*grain;gl_FragColor=vec4(col,1.);}";
  var gl = null, prog = null, U = {}, seepT = 0, seepNow = 0;
  try {
    gl = cv.getContext("webgl", { antialias: false, alpha: false });
    if (gl) {
      var mk = function (t, src) { var sh = gl.createShader(t); gl.shaderSource(sh, src); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; };
      prog = gl.createProgram(); gl.attachShader(prog, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
      var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      ["res", "time", "front", "soft", "lag", "scale", "flow", "bias", "rim", "grain"].forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });
    }
  } catch (err) { gl = null; }
  function draw() {
    if (!gl) { cv.style.opacity = String(1 - seepT); return; }
    var soft = CFG.seepSoft / 100, lag = CFG.seepLag / 100, sC = soft * 2.4, lC = lag * 2;
    var f0 = Math.min(-soft, lC - sC, lag - soft * 1.6) - .02, f1 = 1 + Math.max(soft, lag + soft * 1.6, lC + sC) + .02;
    gl.uniform2f(U.res, cv.width, cv.height); gl.uniform1f(U.time, seepNow / 1000); gl.uniform1f(U.front, f0 + (f1 - f0) * seepT);
    gl.uniform1f(U.soft, soft); gl.uniform1f(U.lag, lag); gl.uniform1f(U.scale, CFG.seepScale / 10); gl.uniform1f(U.flow, CFG.seepFlow / 100);
    gl.uniform1f(U.bias, CFG.seepBias / 100); gl.uniform1f(U.rim, CFG.seepRim / 100); gl.uniform1f(U.grain, CFG.seepGrain / 100);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function sizeCv() { cv.width = Math.max(2, Math.round(innerWidth * .5)); cv.height = Math.max(2, Math.round(innerHeight * .5)); if (gl) gl.viewport(0, 0, cv.width, cv.height); draw(); }
  sizeCv(); window.__size = sizeCv;

  function wipe() {
    wiping = true; wipeActive = true; intro.classList.add("out"); exitT0 = performance.now();
    [].forEach.call(big.children, function (sp, i) {
      sp.animate([{ transform: "translateY(0)", opacity: 1, filter: "blur(0px)" }, { transform: "translateY(60%)", opacity: 0, filter: "blur(6px)" }],
        { duration: reduce ? 1 : CFG.exitTime, delay: reduce ? 0 : i * CFG.exitStagger, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" });
    });
    var D = reduce ? 400 : CFG.seepTime, s0 = performance.now();
    (function step(now) {
      if (RUN !== window.__run) return;
      var k = Math.min(1, (now - s0) / D);
      seepT = .5 - .5 * Math.cos(Math.PI * k); /* sine in-out: slow start, steady soak, soft tail */
      seepNow = now - s0; draw(); liquid(now);
      if (k < 1) return requestAnimationFrame(step);
      wipeActive = false; cv.style.display = "none"; intro.style.display = "none";
      document.getElementById("replay").classList.add("on");
    })(performance.now());
  }
  }
  addEventListener("resize", function () { if (window.__fit) window.__fit(); if (window.__size) window.__size(); });
  document.getElementById("replay").addEventListener("click", play);
  addEventListener("keydown", function (e) { if (e.key === "r" || e.key === "R") play(); });
  /* ---------- control panel ---------- */
  var DEF = JSON.parse(JSON.stringify(CFG)), KEY = "sehzade-loading-cfg";
  try { var sv = JSON.parse(localStorage.getItem(KEY) || "{}"); Object.keys(sv).forEach(function (k) { if (k in CFG) CFG[k] = +sv[k]; }); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(CFG)); } catch (e) {} }
  var ROWS = [
    ["#", "Loading"],
    ["min", "Minimum loading time", 1000, 10000, 100, "ms", "Shortest time the red screen stays, even if everything is ready sooner."],
    ["line", "Line thickness", 1, 16, 1, "px", "Thickness of the black loading line. It always spans the full screen width."],
    ["#", "SEHZADE text"],
    ["letterDelay", "Start delay", 0, 1500, 25, "ms", "Wait before the first letter rises."],
    ["letterTime", "Letter rise time", 300, 3000, 50, "ms", "How long each letter takes to rise into place."],
    ["letterStagger", "Letter stagger", 0, 300, 5, "ms", "Delay between one letter and the next."],
    ["liquid", "Liquid (steady)", 0, 40, 1, "px", "Constant liquid ripple on the letters."],
    ["liquidBurst", "Liquid (opening burst)", 0, 80, 1, "px", "Extra ripple right when the page opens."],
    ["liquidBurstTime", "Burst calms down over", 300, 6000, 100, "ms", "How long the opening ripple takes to settle."],
    ["#", "Text leaves"],
    ["exitTime", "Exit time", 200, 3000, 50, "ms", "How long the text takes to disappear once loading is done."],
    ["exitMelt", "Liquid melt", 0, 200, 5, "px", "How strongly the letters warp and melt while they go."],
    ["exitStagger", "Exit stagger", 0, 200, 5, "ms", "Delay between one letter and the next while they leave."],
    ["#", "Red seeps into black"],
    ["seepTime", "Absorb time", 1500, 10000, 100, "ms", "How long the red takes to be soaked up completely. Higher is slower and calmer."],
    ["seepSoft", "Edge softness", 3, 50, 1, "%", "How wide and blurry the front between red and black is. Low is a sharper stain, high is a diffuse fade."],
    ["seepLag", "Depth layers spread", 0, 60, 1, "%", "How far the deeper layers of red (dark red, then smoky ember) trail behind the surface. 0 is a single flat layer."],
    ["seepScale", "Patch detail", 5, 60, 1, "", "Size of the patches the red breaks into. Low is a few big areas, high is many fine ones."],
    ["seepFlow", "Flow", 0, 300, 5, "%", "How fast the patches drift while they dissolve. 0 keeps them still."],
    ["seepBias", "Direction", 0, 100, 1, "%", "0 soaks in at random places, 100 soaks in from the bottom of the screen upward."],
    ["seepRim", "Hot edge glow", 0, 100, 1, "%", "Warm glow along the edge of the red as it is absorbed."],
    ["seepGrain", "Grain", 0, 10, 1, "%", "Fine film grain that keeps the gradients from banding."]
  ];
  var ui = document.getElementById("panel"), list = document.getElementById("panel-list"), inputs = {}, pend = 0;
  function replayLater() { clearTimeout(pend); pend = setTimeout(play, 350); }
  ROWS.forEach(function (r) {
    if (r[0] === "#") { var h = document.createElement("div"); h.className = "pn-sec"; h.textContent = r[1]; list.appendChild(h); return; }
    var row = document.createElement("label"), name = document.createElement("span"), val = document.createElement("b"), inp = document.createElement("input"), d = document.createElement("small");
    row.className = "pn-row"; name.textContent = r[1]; d.textContent = r[6];
    inp.type = "range"; inp.min = r[2]; inp.max = r[3]; inp.step = r[4]; inp.id = "pn-" + r[0]; inp.value = CFG[r[0]];
    function show() { val.textContent = CFG[r[0]] + r[5]; }
    show();
    inp.addEventListener("input", function () { CFG[r[0]] = +inp.value; show(); save(); });
    inp.addEventListener("change", replayLater);
    inputs[r[0]] = [inp, show]; row.append(name, val, inp, d); list.appendChild(row);
  });
  document.getElementById("pn-reset").onclick = function () { Object.keys(DEF).forEach(function (k) { CFG[k] = DEF[k]; if (inputs[k]) { inputs[k][0].value = DEF[k]; inputs[k][1](); } }); save(); play(); };
  document.getElementById("pn-replay").onclick = function () { play(); };
  var cp = document.getElementById("pn-copy");
  cp.onclick = function () {
    var txt = JSON.stringify(CFG), ok = function () { cp.textContent = "Copied"; setTimeout(function () { cp.textContent = "Copy values"; }, 1400); };
    try { navigator.clipboard.writeText(txt).then(ok, function () { cp.textContent = "Not allowed"; }); } catch (e) { cp.textContent = "Not allowed"; }
  };
  var tg = document.getElementById("pn-toggle");
  function openPanel(v) { ui.classList.toggle("shut", !v); tg.setAttribute("aria-expanded", v); tg.textContent = v ? "Hide controls" : "Controls (C)"; }
  tg.onclick = function () { openPanel(ui.classList.contains("shut")); };
  addEventListener("keydown", function (e) { if ((e.key === "c" || e.key === "C") && !/INPUT|TEXTAREA/.test((e.target || {}).tagName || "")) tg.click(); });
  openPanel(true);
  play();
})();
</script>
</body>
</html>
